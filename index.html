<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hologram-container">
        <div class="jarvis-circle">
            <div class="circle-core">
                <div class="core-glow"></div>
                <div class="status-ring">
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        <span class="status-text">JARVIS</span>
                    </div>
                </div>
                <div class="interface-ring">
                    <div class="voice-button" id="voiceBtn">
                        <div class="button-icon">🎤</div>
                        <div class="button-text">SPEAK</div>
                    </div>
                </div>
                <div class="data-ring">
                    <div class="response-display">
                        <div id="response" class="response"></div>
                    </div>
                </div>
                <div class="input-ring">
                    <div class="input-controls">
                        <input type="text" id="textInput" placeholder="Command input..." autocomplete="off">
                        <button id="sendBtn">EXECUTE</button>
                    </div>
                </div>
            </div>
            
            <!-- Holographic grid lines -->
            <div class="grid-lines">
                <div class="grid-line horizontal"></div>
                <div class="grid-line vertical"></div>
                <div class="grid-line diagonal-1"></div>
                <div class="grid-line diagonal-2"></div>
            </div>
            
            <!-- Floating particles -->
            <div class="floating-particles">
                <div class="particle p1"></div>
                <div class="particle p2"></div>
                <div class="particle p3"></div>
                <div class="particle p4"></div>
                <div class="particle p5"></div>
                <div class="particle p6"></div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
