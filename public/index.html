<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
<meta charset="utf-8">
<title>J.A.R.V.I.S</title>

<style>
body {
  margin: 0;
  font-family: Helvetica, sans-serif;
  background: linear-gradient(to right, #000000, #000203);
  color: rgb(21, 116, 139);
  text-align: center;
}

/* CENTERING */
.vertical-center {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* JARVIS HUD */
svg.jarvis {
  margin-bottom: 20px;
}

/* INPUT */
input {
  padding: 10px;
  border-radius: 8px;
  border: none;
  text-align: center;
  width: 250px;
}

/* MESSAGE LOG */
#messageLog {
  margin-top: 20px;
  max-width: 500px;
  white-space: pre-wrap;
}

/* USER + AI */
.user {
  text-align: right;
  color: rgb(0, 225, 255);
}

.ai {
  text-align: left;
  color: rgb(255, 196, 0);
}

/* WAVE */
.wave svg {
  background: transparent;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="vertical-center">

  <!-- JARVIS TITLE -->
  <h2>J.A.R.V.I.S</h2>

  <!-- JARVIS HUD -->
  <svg class="jarvis" width="210" height="210">
    <circle cx="105" cy="105" r="100" stroke="#B4F6FB" stroke-width="2" fill="none" stroke-dasharray="50,5"/>
    <circle cx="105" cy="105" r="95" stroke="#64E6EF" stroke-width="1.5" fill="none"/>

    <circle cx="105" cy="105" r="80" stroke="#B4F6FB" stroke-width="10" fill="none" stroke-dasharray="2,2.29">
      <animateTransform attributeName="transform" type="rotate"
        from="0 105 105" to="360 105 105"
        dur="10s" repeatCount="indefinite"/>
    </circle>

    <circle cx="105" cy="105" r="61" stroke="#B4F6FB" stroke-width="2" fill="none" stroke-dasharray="50,25">
      <animateTransform attributeName="transform" type="rotate"
        from="0 105 105" to="-360 105 105"
        dur="10s" repeatCount="indefinite"/>
    </circle>

    <circle cx="105" cy="105" r="50" stroke="#64E6EF" stroke-width="15" fill="none"/>
    <circle cx="105" cy="105" r="40" stroke="#64E6EF" stroke-width="2" fill="none"/>

    <path d="M105 120 L130 95 L80 95 Z"
      fill="#D1FBFC" stroke="#B4F6FB" stroke-width="5"/>
  </svg>

  <!-- INPUT -->
  <input id="input" placeholder="Say something..." onkeydown="handleKey(event)">

  <!-- WAVE -->
  <div class="wave">
    <svg width="200" height="50">
      <polyline id="line"/>
      <polyline id="line2"/>
      <polyline id="line3"/>
    </svg>
  </div>

  <!-- LOG -->
  <div id="messageLog"></div>

</div>

<script>

/* ========================
   MESSAGE SYSTEM
======================== */
function logMessage(text, type) {
  const div = document.createElement("div");
  div.className = type;
  div.textContent = text;
  document.getElementById("messageLog").appendChild(div);
}

/* ========================
   INPUT HANDLER
======================== */
function handleKey(e) {
  if (e.key === "Enter") {
    const input = document.getElementById("input");
    const text = input.value;
    input.value = "";

    logMessage("You: " + text, "user");

    respond(text);
  }
}

/* ========================
   BASIC AI RESPONSE
======================== */
function respond(text) {
  let reply = "Processing...";

  if (text.toLowerCase().includes("hello")) {
    reply = "Hello, sir.";
  } else if (text.toLowerCase().includes("time")) {
    reply = new Date().toLocaleTimeString();
  } else {
    reply = "I am still learning, sir.";
  }

  setTimeout(() => {
    logMessage("JARVIS: " + reply, "ai");
  }, 500);
}

/* ========================
   WAVE ANIMATION
======================== */
let shift = 0;

function generateWave(id, amp, freq) {
  let points = "";
  for (let x = 0; x <= 200; x += 2) {
    let y = 25 + amp * Math.sin((x + shift) * freq);
    points += `${x},${y} `;
  }
  document.getElementById(id).setAttribute("points", points);
}

function animateWave() {
  shift += 2;
  generateWave("line", 5, 0.05);
  generateWave("line2", 8, 0.04);
  generateWave("line3", 10, 0.08);
}

setInterval(animateWave, 30);

</script>

</body>
</html>
