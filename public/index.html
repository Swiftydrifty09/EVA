<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS HUD</title>

<style>
:root {
  --primary: #00f0ff;
  --accent: #ff3b3b;
  --bg: #05060a;
  --glass: rgba(0, 255, 255, 0.08);
}

body {
  margin: 0;
  font-family: 'Orbitron', sans-serif;
  background: var(--bg);
  color: var(--primary);
  overflow: hidden;
}

.hud {
  display: grid;
  grid-template-columns: 300px 1fr 300px;
  grid-template-rows: 80px 1fr 100px;
  height: 100vh;
  gap: 10px;
  padding: 10px;
}

.panel {
  background: var(--glass);
  border: 1px solid rgba(0,255,255,0.3);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 20px rgba(0,255,255,0.2);
  border-radius: 12px;
  padding: 10px;
  position: relative;
}

.glow {
  text-shadow: 0 0 10px var(--primary);
}

/* Layout Areas */
.header { grid-column: 1 / 4; }
.left { grid-row: 2; }
.center { grid-row: 2; }
.right { grid-row: 2; }
.footer { grid-column: 1 / 4; }

/* Chat */
.chat-box {
  height: 100%;
  overflow-y: auto;
}

.message {
  margin: 5px 0;
}

.user { color: white; }
.ai { color: var(--primary); }

/* Input */
.input-container {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 10px;
  background: transparent;
  border: 1px solid var(--primary);
  color: var(--primary);
}

button {
  padding: 10px 20px;
  background: transparent;
  border: 1px solid var(--primary);
  color: var(--primary);
  cursor: pointer;
}

button:hover {
  background: rgba(0,255,255,0.2);
}

/* Orb */
.orb {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: radial-gradient(circle, #00f0ff, transparent);
  margin: auto;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: 0.6; }
  100% { transform: scale(1); opacity: 1; }
}

/* Scanline */
.panel::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 2px;
  background: rgba(0,255,255,0.3);
  animation: scan 4s linear infinite;
}

@keyframes scan {
  0% { top: 0 }
  100% { top: 100% }
}
</style>
</head>

<body>
<div class="hud">

  <div class="panel header glow">
    JARVIS SYSTEM ONLINE
  </div>

  <div class="panel left">
    <h3 class="glow">WEATHER</h3>
    <div id="weather">Loading...</div>
  </div>

  <div class="panel center">
    <div class="chat-box" id="chat"></div>
  </div>

  <div class="panel right">
    <h3 class="glow">SYSTEM</h3>
    <div>CPU: 42%</div>
    <div>Memory: 68%</div>
    <div>Status: ONLINE</div>
    <div class="orb"></div>
  </div>

  <div class="panel footer">
    <div class="input-container">
      <input id="input" placeholder="Ask JARVIS..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<script>
const chat = document.getElementById("chat");

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "message " + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("input");
  const message = input.value;
  input.value = "";

  addMessage("You: " + message, "user");

  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message, userId: "default" })
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();

  let aiMessage = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    const chunk = decoder.decode(value);

    if (chunk.includes("[DONE]")) break;

    aiMessage += chunk.replace("data:", "");

    let last = chat.querySelector(".ai:last-child");
    if (!last) {
      last = document.createElement("div");
      last.className = "message ai";
      chat.appendChild(last);
    }

    last.textContent = "JARVIS: " + aiMessage;
  }
}

// Simple weather fetch
async function loadWeather() {
  try {
    const res = await fetch("https://api.openweathermap.org/data/2.5/weather?q=Sylvania&units=imperial&appid=YOUR_API_KEY");
    const data = await res.json();

    document.getElementById("weather").innerHTML = `
      ${data.name}<br>
      ${data.main.temp}°F<br>
      ${data.weather[0].main}
    `;
  } catch {
    document.getElementById("weather").textContent = "Weather unavailable";
  }
}

loadWeather();
</script>

</body>
</html>
